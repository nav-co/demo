name: Env Setup

on:
  # Adjust triggers to match your needs
  workflow_dispatch:

jobs:
  env-setup:
    # Bitrise Runner (macOS) — update the label to match your self-hosted runner config
    runs-on:
      group: Bitrise-M4Pro

    steps:
      # ---------------------------------------------------------------
      # 1. Checkout
      # ---------------------------------------------------------------
      - name: Git Clone
        uses: actions/checkout@v4

      - name: Setup Ruby (Bitrise)
        run: |
          RUBY_VERSION=$(cat .ruby-version)
          asdf list ruby
          if ! asdf list ruby | grep -q "$RUBY_VERSION"; then
            asdf install ruby
          fi
          asdf global ruby $RUBY_VERSION

      - name: Print Ruby version
        run: ruby --version
