name: Env Setup

on:
  # Adjust triggers to match your needs
  workflow_dispatch:

jobs:
  env-setup:
    # Bitrise Runner (macOS) — update the label to match your self-hosted runner config
    runs-on:
      group: Bitrise-M4Pro

    steps:
      # ---------------------------------------------------------------
      # 1. Checkout
      # ---------------------------------------------------------------
      - name: Git Clone
        uses: actions/checkout@v4

      - name: Setup Ruby (Bitrise)
        run: |
          asdf install ruby
          #bundle install

      - name: Print Ruby version
        run: ruby --version
